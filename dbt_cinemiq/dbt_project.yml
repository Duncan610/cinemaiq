name: 'dbt_cinemiq'
version: '1.0.0'
config-version: 2

profile: 'dbt_cinemiq'

model-paths:  ["models"]
test-paths:   ["tests"]
seed-paths:   ["seeds"]
macro-paths:  ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_cinemiq:
    staging:
      +schema:        staging
      +materialized:  view
      +tags:          ["staging"]
    intermediate:
      +schema:        intermediate
      +materialized:  view
      +tags:          ["intermediate"]
    marts:
      +schema:        marts
      +materialized:  table
      +tags:          ["marts", "gold"]
