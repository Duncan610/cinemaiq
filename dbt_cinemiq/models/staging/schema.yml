version: 2

models:
  - name: stg_tmdb_movies
    description: "Cleaned TMDB movie data."
    columns:
      - name: tmdb_id
        tests: [not_null, unique]
      - name: title
        tests: [not_null]

  - name: stg_omdb_ratings
    description: "Cleaned OMDB ratings. Core signal: critic_audience_gap."
    columns:
      - name: imdb_id
        tests: [not_null]
      - name: gap_category
        tests:
          - accepted_values:
              values: ['critics_loved_it', 'critics_preferred', 'consensus',
                       'audiences_preferred', 'audiences_loved_it']

  - name: stg_news_articles
    description: "Cleaned NewsAPI articles."
    columns:
      - name: headline
        tests: [not_null]
      - name: sentiment_label
        tests:
          - accepted_values:
              values: ['positive', 'negative', 'neutral']

  - name: stg_box_office
    description: "Cleaned Box Office Mojo revenue data."
    columns:
      - name: title
        tests: [not_null]
      - name: revenue_tier
        tests:
          - accepted_values:
              values: ['blockbuster', 'wide_release', 'limited_release', 'low_performer', 'unknown']

  - name: stg_google_trends
    description: "Cleaned Google Trends interest scores."
    columns:
      - name: trend_date
        tests: [not_null]
      - name: interest_score
        tests: [not_null]

  - name: stg_imdb_movies
    description: "Cleaned IMDb basics + ratings, joined at staging."
    columns:
      - name: imdb_id
        tests: [not_null, unique]
      - name: title
        tests: [not_null]